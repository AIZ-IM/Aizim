<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aizim Research</title><style>
:root{font:15px/1.6 system-ui,sans-serif;color:#192a38;background:#f4f6f7}body{max-width:1200px;margin:auto;padding:32px}
header{display:flex;justify-content:space-between;align-items:center}h1{font-size:32px;letter-spacing:-1px;margin:0}
h2{font-size:20px;margin-top:30px}.muted{color:#617181}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.card{background:white;border:1px solid #dbe2e7;border-radius:12px;padding:20px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f5f7f9;padding:12px;border-radius:6px}
.tag{display:inline-block;padding:3px 9px;border-radius:16px;background:#eef2f5;font-size:12px;margin-right:8px}.verified{background:#ddf5e5;color:#17633b}.blocked{background:#fff0d5;color:#885c12}
table{width:100%;border-collapse:collapse;background:white}th,td{text-align:left;padding:10px;border-bottom:1px solid #e0e6eb;vertical-align:top}
details{margin-top:10px}summary{cursor:pointer}p{overflow-wrap:anywhere}.note{border-left:3px solid #487590;padding-left:15px}.row{display:flex;flex-wrap:wrap;gap:10px}
select,input{padding:8px;border:1px solid #bbc8d1;border-radius:6px;background:white}.empty{color:#617181;font-style:italic}
svg{width:100%;min-height:100px;background:white;border-radius:12px}footer{margin:30px 0;color:#617181;font-size:12px}
</style></head><body>
<header><div><div class="muted">AIZIM · RESEARCH RECORD</div><h1 id="project">Research</h1></div><span id="refresh" class="muted"></span></header>
<p class="note">Lean checks formal validity. Human reviews record meaning, research value, library quality, and exposition separately.</p>
<div class="row"><label>Filter targets <input id="query" placeholder="Title or statement"></label><label>Status <select id="status"><option value="">All</option><option>pending</option><option>running</option><option>verified</option><option>blocked</option></select></label></div>
<h2>Targets and dependencies</h2><div id="tasks" class="grid"></div><h2>Dependency graph</h2><div id="graph"></div>
<h2>Human contributions and reviews</h2><div id="humans" class="grid"></div>
<h2>Operator inbox</h2><div id="inbox" class="grid"></div>
<h2>Research memory</h2><div id="memory" class="grid"></div>
<h2>Measured usage</h2><div id="usage"></div><p id="usage-note" class="muted"></p>
<h2>Attempts</h2><div id="attempts"></div>
<footer id="footer"></footer><script>
const initial=__SNAPSHOT__;let state=initial;
const el=(tag,text,cls)=>{let n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n};
const clear=id=>{let n=document.getElementById(id);n.replaceChildren();return n};
function cards(id,entries){let root=clear(id);if(!entries.length)root.append(el('p','No records yet.','empty'));for(const e of entries){let c=el('article',undefined,'card');c.append(el('span',e.role||e.kind||e.status,'tag'),el('strong',e.author||e.worker_id||e.id),el('p',e.body||e.feedback||''));if(e.task_id)c.append(el('small','Target: '+e.task_id));if(e.verdict)c.append(el('p','Review: '+e.verdict));if(e.created_at)c.append(el('p','Recorded: '+e.created_at,'muted'));if(e.consumed_by)c.append(el('small',' · Read in '+e.consumed_by.length+' rounds'));root.append(c)}}
function table(id,rows,keys){let root=clear(id),t=el('table'),h=el('tr');for(let k of keys)h.append(el('th',k.replaceAll('_',' ')));t.append(h);for(let row of rows){let r=el('tr');for(let k of keys)r.append(el('td',row[k]===null||row[k]===undefined?'Unknown':String(row[k])));t.append(r)}root.append(t)}
function render(){if(!state)return;let r=state.records;document.getElementById('project').textContent=state.project;document.getElementById('refresh').textContent=state.generated_at;
 let root=clear('tasks'),q=document.getElementById('query').value.toLowerCase(),s=document.getElementById('status').value;
 for(let task of r.task.filter(t=>(!s||t.status===s)&&JSON.stringify(t).toLowerCase().includes(q))){let c=el('article',undefined,'card');c.id='target-'+task.task_id;c.append(el('span',task.paused?'paused':task.status,'tag '+task.status),el('strong',task.title),el('pre',task.statement),el('p','Proposed by '+task.author),el('small','Round '+task.rounds+'/'+task.max_rounds+' · Dependencies: '+(task.depends_on.join(', ')||'none')));let d=el('details');d.append(el('summary','Evidence and feedback'),el('pre',JSON.stringify({target_hash:task.target_hash,verified_declarations:task.verified_declarations,source_refs:task.source_refs,feedback:task.feedback},null,2)));c.append(d);root.append(c)}
 cards('humans',[...r.contribution,...r.review]);cards('inbox',r.inbox);cards('memory',r.memory);
 table('usage',state.usage,['model','input_tokens','cached_input_tokens','output_tokens','unknown_stages','known_usage_usd','estimated_usd']);document.getElementById('usage-note').textContent=state.usage_scope+' Prices are operator-supplied estimates, not a bill.';
 table('attempts',r.attempt,['task_id','round','status','feedback']);document.getElementById('footer').textContent='Local private record · Identity: '+state.identity_assurance+' · Record hash: '+state.content_hash;
 const ns='http://www.w3.org/2000/svg',g=clear('graph'),svg=document.createElementNS(ns,'svg');
 const nodes=r.task,byId=new Map(nodes.map(t=>[t.task_id,t])),levels=new Map(),rows=new Map(),positions=new Map();
 function level(id,seen=new Set()){if(levels.has(id))return levels.get(id);if(seen.has(id))return 0;seen.add(id);const t=byId.get(id);const deps=(t?.depends_on||[]).filter(d=>byId.has(d));const value=deps.length?1+Math.max(...deps.map(d=>level(d,new Set(seen)))):0;levels.set(id,value);return value}
 function shape(tag,attrs){const n=document.createElementNS(ns,tag);for(const[k,v]of Object.entries(attrs))n.setAttribute(k,String(v));return n}
 for(const t of nodes){const depth=level(t.task_id),row=rows.get(depth)||0;rows.set(depth,row+1);positions.set(t.task_id,[30+depth*350,25+row*85])}
 const width=Math.max(720,(Math.max(0,...levels.values())+1)*350+30),height=Math.max(100,...[...rows.values()].map(n=>n*85+20));svg.setAttribute('viewBox',`0 0 ${width} ${height}`);
 const defs=shape('defs',{}),marker=shape('marker',{id:'arrow',viewBox:'0 0 10 10',refX:9,refY:5,markerWidth:6,markerHeight:6,orient:'auto-start-reverse'});marker.append(shape('path',{d:'M 0 0 L 10 5 L 0 10 z',fill:'#7593a6'}));defs.append(marker);svg.append(defs);
 for(const t of nodes){const[x,y]=positions.get(t.task_id);for(const dep of t.depends_on){const p=positions.get(dep);if(p)svg.append(shape('line',{x1:p[0]+290,y1:p[1]+25,x2:x-5,y2:y+25,stroke:'#7593a6','stroke-width':2,'marker-end':'url(#arrow)'}))}}
 for(const t of nodes){const[x,y]=positions.get(t.task_id),group=shape('g',{tabindex:0,role:'button','aria-label':t.task_id});group.style.cursor='pointer';group.append(shape('rect',{x,y,width:290,height:50,rx:8,fill:t.status==='verified'?'#ddf5e5':'#f2f5f7',stroke:'#ccd8df'}));const label=shape('text',{x:x+12,y:y+31,'font-size':14});label.textContent=(t.task_id.length>24?t.task_id.slice(0,22)+'…':t.task_id)+' · '+t.status;group.append(label);const select=()=>{document.getElementById('query').value='';document.getElementById('status').value='';render();document.getElementById('target-'+t.task_id)?.scrollIntoView({behavior:'smooth'})};group.addEventListener('click',select);group.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ')select()});svg.append(group)}g.append(svg);
}
document.getElementById('query').addEventListener('input',render);document.getElementById('status').addEventListener('change',render);
async function refresh(){try{let res=await fetch('/api/snapshot',{cache:'no-store'});if(!res.ok)throw Error('State temporarily unavailable');state=await res.json();render()}catch(e){document.getElementById('refresh').textContent=String(e)}}
if(initial){render()}else{refresh();setInterval(refresh,3000)}
</script></body></html>
