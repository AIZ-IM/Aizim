name: Lean integration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create private temporary root
        run: |
          mkdir -p "$RUNNER_TEMP/aizim-private-tmp"
          chmod 700 "$RUNNER_TEMP/aizim-private-tmp"
          echo "TMPDIR=$RUNNER_TEMP/aizim-private-tmp" >> "$GITHUB_ENV"
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install latest pinned npm
        run: |
          npm install --global --prefix "$RUNNER_TEMP/npm-12" npm@12.0.1
          echo "$RUNNER_TEMP/npm-12/bin" >> "$GITHUB_PATH"
          test "$(node --version)" = "v26.5.0"
          test "$("$RUNNER_TEMP/npm-12/bin/npm" --version)" = "12.0.1"
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.31"
          enable-cache: false
      - name: Install controller CLIs
        run: |
          npm install --global --allow-scripts=@anthropic-ai/claude-code \
            @openai/codex@0.145.0 @anthropic-ai/claude-code@2.1.218
          test "$(codex --version)" = "codex-cli 0.145.0"
          test "$(claude --version)" = "2.1.218 (Claude Code)"
      - name: Install pinned Lean toolchain
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          auto-config: false
          lake-package-directory: examples/smoke_lean
          use-github-cache: false
          use-mathlib-cache: false
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Test Lean and sandbox surfaces without a model API
        run: >-
          uv run pytest
          -m "macos_sandbox or lean_integration"
          --ignore=tests/e2e/test_real_codex_smoke.py
          -q
      - name: Run Gate B without a model
        run: |
          cp -R tests/fixtures/attack_probe_project "$RUNNER_TEMP/attack-probe-project"
          uv run aizim init "$RUNNER_TEMP/attack-probe-project"
          uv run aizim security-probe \
            --project "$RUNNER_TEMP/attack-probe-project" \
            --backend codex \
            --no-model
