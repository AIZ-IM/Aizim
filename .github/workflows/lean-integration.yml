name: Lean integration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Install latest pinned npm
        run: |
          npm install --global npm@12.0.1
          test "$(node --version)" = "v26.5.0"
          test "$(npm --version)" = "12.0.1"
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.31"
          enable-cache: false
      - name: Install Codex CLI
        run: |
          npm install --global @openai/codex@0.145.0
          test "$(codex --version)" = "codex-cli 0.145.0"
      - name: Install pinned Lean toolchain
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          auto-config: false
          lake-package-directory: examples/smoke_lean
          use-github-cache: false
          use-mathlib-cache: false
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Test Lean and sandbox surfaces without a model API
        run: >-
          uv run pytest
          -m "macos_sandbox or lean_integration"
          --ignore=tests/e2e/test_real_codex_smoke.py
          -q
      - name: Run Gate B without a model
        run: >-
          uv run aizim security-probe
          --project tests/fixtures/attack_probe_project
          --backend codex
          --no-model
