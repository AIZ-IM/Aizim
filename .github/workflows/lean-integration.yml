name: Lean integration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create private temporary root
        run: |
          mkdir -p "$RUNNER_TEMP/aizim-private-tmp"
          chmod 700 "$RUNNER_TEMP/aizim-private-tmp"
          echo "TMPDIR=$RUNNER_TEMP/aizim-private-tmp" >> "$GITHUB_ENV"
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: false
      - name: Install pinned Lean toolchain
        uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1.7.1
        with:
          auto-config: false
          lake-package-directory: examples/smoke_lean
          use-github-cache: false
          use-mathlib-cache: false
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Test Lean integration without a model API
        run: >-
          uv run pytest
          tests/integration/test_research_lean.py
          tests/integration/test_research_benchmark_lean.py
          tests/integration/test_compiled_research_index.py
          tests/integration/test_shared_lean_runtime.py
          tests/integration/test_two_worker_shared_run.py
          tests/integration/test_virtual_attempts.py
          tests/integration/test_promotion_real.py
          tests/integration/test_promotion_activation_recovery.py
          tests/integration/test_lean_runtime_recovery.py
          tests/integration/test_smoke_project.py
          tests/unit/test_lean_mcp_contract.py
          -m lean_integration
          -q
