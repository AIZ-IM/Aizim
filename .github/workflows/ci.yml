name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create private temporary root
        run: |
          mkdir -p "$RUNNER_TEMP/aizim-private-tmp"
          chmod 700 "$RUNNER_TEMP/aizim-private-tmp"
          echo "TMPDIR=$RUNNER_TEMP/aizim-private-tmp" >> "$GITHUB_ENV"
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: false
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run ty check
      - name: Test platform-independent surface
        run: >-
          uv run pytest
          -m "not lean_integration and not linux_sandbox and not macos_sandbox"
          -q

  native:
    name: Native ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-15
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: linux-x64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create private temporary root
        run: |
          mkdir -p "$RUNNER_TEMP/aizim-private-tmp"
          chmod 700 "$RUNNER_TEMP/aizim-private-tmp"
          echo "TMPDIR=$RUNNER_TEMP/aizim-private-tmp" >> "$GITHUB_ENV"
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install external ripgrep prerequisite
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install --yes ripgrep
          else
            brew install ripgrep
          fi
          rg --version
      - name: Install latest pinned npm
        run: |
          npm install --global --prefix "$RUNNER_TEMP/npm-12" npm@12.2.2
          echo "$RUNNER_TEMP/npm-12/bin" >> "$GITHUB_PATH"
          test "$("$RUNNER_TEMP/npm-12/bin/npm" --version)" = "12.2.2"
      - name: Install source dependencies without lock drift
        run: |
          npm install
          git diff --exit-code -- package-lock.json
          node --test \
            tests/npm/package-contract.test.mjs \
            tests/npm/package-contents.test.mjs
      - name: Build native distribution
        run: npm run build
      - name: Test native distribution
        run: npm test
      - name: Pack native distribution
        run: npm run pack
      - name: Write native evidence
        run: |
          node scripts/npm/write-ci-evidence.mjs \
            --target "${{ matrix.target }}" \
            --output "$GITHUB_WORKSPACE/dist/npm/native-evidence-${{ matrix.target }}.json"
      - name: Upload native evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aizim-native-${{ matrix.target }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: |
            dist/npm/*.tgz
            dist/npm/pack-summary.json
            dist/npm/native-evidence-${{ matrix.target }}.json
            build/npm/build-summary.json
            build/npm/install-smoke-evidence.json
            build/npm/test-summary.json
            build/npm/meta/manifest/distribution.json
            build/npm/${{ matrix.target }}/manifest/platform.json

  minimum-node:
    name: Minimum Node.js 22.22.2
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create private temporary root
        run: |
          mkdir -p "$RUNNER_TEMP/aizim-private-tmp"
          chmod 700 "$RUNNER_TEMP/aizim-private-tmp"
          echo "TMPDIR=$RUNNER_TEMP/aizim-private-tmp" >> "$GITHUB_ENV"
      - name: Install build Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install external ripgrep prerequisite
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep
          rg --version
      - name: Install latest pinned npm
        run: |
          npm install --global --prefix "$RUNNER_TEMP/npm-12" npm@12.2.2
          echo "$RUNNER_TEMP/npm-12/bin" >> "$GITHUB_PATH"
          test "$("$RUNNER_TEMP/npm-12/bin/npm" --version)" = "12.2.2"
      - name: Install and build from source
        run: |
          npm install
          git diff --exit-code -- package-lock.json
          node --test \
            tests/npm/package-contract.test.mjs \
            tests/npm/package-contents.test.mjs
          npm run build
          npm run pack
      - name: Install minimum Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.22.2"
          package-manager-cache: false
      - name: Install current npm on minimum Node.js
        run: |
          npm install --global --prefix "$RUNNER_TEMP/npm-12-minimum" npm@12.2.2
          echo "$RUNNER_TEMP/npm-12-minimum/bin" >> "$GITHUB_PATH"
          test "$(node --version)" = "v22.22.2"
          test "$("$RUNNER_TEMP/npm-12-minimum/bin/npm" --version)" = "12.2.2"
      - name: Test minimum Node.js consumer
        run: |
          node --test \
            tests/npm/package-contract.test.mjs \
            tests/npm/platform-resolution.test.mjs \
            tests/npm/assets.test.mjs \
            tests/npm/launch.test.mjs
          node scripts/npm/install-smoke.mjs
          node -e 'const x=require("./build/npm/install-smoke-evidence.json"); if(x.node_version!=="v22.22.2") process.exit(1)'
      - name: Write minimum Node.js evidence
        run: |
          node scripts/npm/write-ci-evidence.mjs \
            --target linux-x64 \
            --minimum-node-version v22.22.2 \
            --output "$GITHUB_WORKSPACE/dist/npm/minimum-node-evidence.json"
      - name: Upload minimum Node.js evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aizim-minimum-node-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: |
            dist/npm/*.tgz
            dist/npm/pack-summary.json
            dist/npm/minimum-node-evidence.json
            build/npm/build-summary.json
            build/npm/install-smoke-evidence.json
            build/npm/meta/manifest/distribution.json
            build/npm/linux-x64/manifest/platform.json

  aggregate:
    name: Aggregate native evidence
    needs:
      - native
      - minimum-node
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Download native evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: aizim-native-*-${{ github.sha }}
          path: ${{ runner.temp }}/aizim-native-evidence
          merge-multiple: false
      - name: Download minimum Node.js evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: aizim-minimum-node-${{ github.sha }}
          path: ${{ runner.temp }}/aizim-native-evidence/aizim-minimum-node-${{ github.sha }}
      - name: Verify aggregate evidence
        run: |
          node scripts/npm/verify-ci-evidence.mjs \
            --directory "$RUNNER_TEMP/aizim-native-evidence" \
            --commit "$GITHUB_SHA" \
            --version 0.1.0 \
            --minimum-node-version v22.22.2 \
            --output "$RUNNER_TEMP/aizim-native-evidence/aggregate.json"
      - name: Upload aggregate evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aizim-native-aggregate-${{ github.sha }}
          path: ${{ runner.temp }}/aizim-native-evidence/aggregate.json
          if-no-files-found: error
          retention-days: 14
