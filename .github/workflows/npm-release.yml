name: npm release candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact Aizim version
        required: true
        type: string
      commit_sha:
        description: Exact full Git commit SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  native:
    name: Release candidate ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-15
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: linux-x64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      AIZIM_RELEASE_VERSION: ${{ inputs.version }}
      AIZIM_RELEASE_COMMIT: ${{ inputs.commit_sha }}
    steps:
      - name: Check out exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false
      - name: Create private temporary root
        run: |
          mkdir -p "$RUNNER_TEMP/aizim-private-tmp"
          chmod 700 "$RUNNER_TEMP/aizim-private-tmp"
          echo "TMPDIR=$RUNNER_TEMP/aizim-private-tmp" >> "$GITHUB_ENV"
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install Lean without caches
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          auto-config: "false"
          build: "false"
          test: "false"
          use-github-cache: "false"
          use-mathlib-cache: "false"
          lake-package-directory: examples/smoke_lean
      - name: Enable Linux sandbox namespaces
        if: runner.os == 'Linux'
        run: |
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          if sudo sysctl -a 2>/dev/null | grep -q '^kernel.apparmor_restrict_unprivileged_userns'; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Validate exact release inputs
        run: |
          node -e 'const {AIZIM_RELEASE_COMMIT:c,AIZIM_RELEASE_VERSION:v}=process.env;if(!/^[0-9a-f]{40}$/.test(c)||!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(v))process.exit(1)'
          test "$(git rev-parse HEAD)" = "$AIZIM_RELEASE_COMMIT"
          test "$(node -p 'require("./package.json").version')" = "$AIZIM_RELEASE_VERSION"
      - name: Install latest pinned npm
        run: |
          npm install --global --prefix "$RUNNER_TEMP/npm-12" npm@12.0.1
          echo "$RUNNER_TEMP/npm-12/bin" >> "$GITHUB_PATH"
          test "$(node --version)" = "v26.5.0"
          test "$("$RUNNER_TEMP/npm-12/bin/npm" --version)" = "12.0.1"
      - name: Build and test release candidate
        run: |
          npm install
          git diff --exit-code -- package-lock.json
          npm run build
          npm test
          npm run pack
      - name: Write native release evidence
        run: |
          node scripts/npm/write-ci-evidence.mjs \
            --target "${{ matrix.target }}" \
            --output "$GITHUB_WORKSPACE/dist/npm/native-evidence-${{ matrix.target }}.json"
          node -e 'const fs=require("node:fs");const p="dist/npm/native-evidence-"+process.env.AIZIM_TARGET+".json";const d=JSON.parse(fs.readFileSync(p));if(d.dirty_tracked_inputs!==false||d.restored_build_cache!==false)process.exit(1)'
        env:
          AIZIM_TARGET: ${{ matrix.target }}
      - name: Upload native release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aizim-release-${{ matrix.target }}-${{ inputs.commit_sha }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: |
            dist/npm/*.tgz
            dist/npm/native-evidence-${{ matrix.target }}.json

  aggregate:
    name: Verify release bundle
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AIZIM_RELEASE_VERSION: ${{ inputs.version }}
      AIZIM_RELEASE_COMMIT: ${{ inputs.commit_sha }}
    steps:
      - name: Check out exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Download native release evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: aizim-release-*-${{ inputs.commit_sha }}
          path: ${{ runner.temp }}/aizim-release-bundle
          merge-multiple: true
      - name: Verify release bundle
        run: |
          node scripts/npm/verify-release-bundle.mjs \
            --directory "$RUNNER_TEMP/aizim-release-bundle" \
            --commit "$AIZIM_RELEASE_COMMIT" \
            --version "$AIZIM_RELEASE_VERSION" \
            --output "$RUNNER_TEMP/aizim-release-bundle/aggregate.json"
      - name: Upload verified release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aizim-release-bundle-${{ inputs.version }}-${{ inputs.commit_sha }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: ${{ runner.temp }}/aizim-release-bundle
