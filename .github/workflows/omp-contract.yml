name: omp RPC and sandbox contract

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  omp-contract:
    name: Deterministic RPC and sandbox ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-15
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: linux-x64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create private temporary root
        run: |
          mkdir -p "$RUNNER_TEMP/aizim-private-tmp"
          chmod 700 "$RUNNER_TEMP/aizim-private-tmp"
          echo "TMPDIR=$RUNNER_TEMP/aizim-private-tmp" >> "$GITHUB_ENV"
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: false
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Verify deterministic omp RPC and workspace contracts
        run: >-
          uv run pytest
          tests/unit/test_omp_rpc.py
          tests/unit/test_omp_backend.py
          tests/integration/test_omp_workspace.py
          -q
      - name: Verify sandbox policy contracts
        run: >-
          uv run pytest
          tests/unit/test_linux_sandbox_profile.py
          tests/unit/test_linux_profile_contract.py
          tests/unit/test_macos_profile_contract.py
          tests/unit/test_sandbox_profile.py
          tests/unit/test_probe_execution.py
          -q
