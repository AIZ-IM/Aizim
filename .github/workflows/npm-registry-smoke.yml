name: npm registry smoke

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact public Aizim version
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke:
    name: Registry smoke ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-15
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: linux-x64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      AIZIM_REGISTRY_VERSION: ${{ inputs.version }}
    steps:
      - name: Check out dispatched repository ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create private temporary root
        run: |
          mkdir -p "$RUNNER_TEMP/aizim-private-tmp"
          chmod 700 "$RUNNER_TEMP/aizim-private-tmp"
          echo "TMPDIR=$RUNNER_TEMP/aizim-private-tmp" >> "$GITHUB_ENV"
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install latest pinned npm
        run: |
          npm install --global --prefix "$RUNNER_TEMP/npm-12" npm@12.2.2
          echo "$RUNNER_TEMP/npm-12/bin" >> "$GITHUB_PATH"
          test "$(node --version)" = "v26.13.0"
          test "$("$RUNNER_TEMP/npm-12/bin/npm" --version)" = "12.2.2"
      - name: Verify public registry package
        run: |
          node scripts/npm/registry-smoke.mjs \
            --version "$AIZIM_REGISTRY_VERSION" \
            --output "$RUNNER_TEMP/registry-smoke-${{ matrix.target }}.json"
      - name: Upload registry smoke evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aizim-registry-smoke-${{ matrix.target }}-${{ inputs.version }}
          path: ${{ runner.temp }}/registry-smoke-${{ matrix.target }}.json
          if-no-files-found: error
          retention-days: 14

  aggregate:
    name: Aggregate registry smoke
    needs: smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      AIZIM_REGISTRY_VERSION: ${{ inputs.version }}
    steps:
      - name: Check out dispatched repository ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Download registry smoke evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: aizim-registry-smoke-*-${{ inputs.version }}
          path: ${{ runner.temp }}/aizim-registry-smoke
          merge-multiple: true
      - name: Aggregate registry smoke evidence
        run: |
          node scripts/npm/registry-smoke.mjs \
            --aggregate \
            --directory "$RUNNER_TEMP/aizim-registry-smoke" \
            --version "$AIZIM_REGISTRY_VERSION" \
            --output "$RUNNER_TEMP/aizim-registry-smoke/aggregate.json"
      - name: Upload registry smoke aggregate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aizim-registry-smoke-aggregate-${{ inputs.version }}
          path: ${{ runner.temp }}/aizim-registry-smoke/aggregate.json
          if-no-files-found: error
          retention-days: 14
