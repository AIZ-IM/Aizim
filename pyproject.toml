[project]
name = "aizim"
version = "0.1.0"
description = "Formal-native autonomous mathematical research with Lean 4"
readme = "README.md"
requires-python = ">=3.12,<3.16"
license = "MIT"
authors = [{ name = "Frankie Wang" }]
dependencies = [
  "jsonschema==4.26.0",
  "lean-lsp-mcp==0.33.0",
  "leanclient==0.13.2",
  "mcp[cli]==2.2.0",
  "PyYAML==6.0.3",
]

[project.scripts]
aizim = "aizim.cli.main:main"
aizim-gateway-sidecar = "aizim.gateway.sidecar:main"

[dependency-groups]
dev = [
  "anyio==4.16.0",
  "pytest==9.2.0",
  "pytest-asyncio==1.4.1.post1",
  "pytest-timeout==2.4.0",
  "ruff==0.17.4",
  "ty==0.0.99",
]

[build-system]
requires = ["uv_build==0.13.7"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers"
markers = [
  "lean_integration: requires pinned Lean 4.35.0",
  "linux_sandbox: requires Linux and a usable bubblewrap sandbox",
  "macos_sandbox: requires macOS and the system sandbox",
  "manual_real_omp: requires a configured magpie model and Lean toolchain",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["src", "tests"]
